# Builds and tests the macOS version on GitHub's Mac machines (there is no Mac here).
# Runs only when asked: a push to the "mac-ci" branch (Apple Silicon only, the quick check) or
# "Run workflow" by hand (choose Intel too). Nothing is published: the dmg / zip files, the
# screenshots and the test report are kept as the run's artifacts for 7 days.
name: macOS build and test

on:
  push:
    branches: [mac-ci]
  workflow_dispatch:
    inputs:
      intel:
        description: Also build and test the Intel version
        type: boolean
        default: false
      apple_silicon:
        description: Build and test the Apple Silicon version
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple-silicon:
    if: github.event_name == 'push' || inputs.apple_silicon
    runs-on: macos-26
    timeout-minutes: 50
    env:
      ARCH: arm64
    steps: &steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: |
          npm ci
          # Electron fetches its program on first use; get it now (checked against its checksums.json).
          node node_modules/electron/install.js
      - name: Unit tests (the Mac-only ones run here too)
        run: npm test
      - name: Fonts, icons and the hash-checked macOS cores (the development app uses them too)
        run: |
          npm run fonts
          npm run icons
          node scripts/fetch-mac-cores.js "$ARCH"
      - name: Interface tests (development app, throw-away data, system proxy untouched)
        run: npm run test:ui
      - name: Build dmg and zip (free ad-hoc signature)
        run: npx electron-builder --mac "--$ARCH" --publish never
      - name: Check the built app
        timeout-minutes: 15
        env:
          BEST_TEST_LINK: ${{ secrets.BEST_TEST_LINK }}
        run: node test/mac/smoke.mjs "$ARCH" "dist/smoke-$ARCH"
      - name: Keep the report and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-mac-${{ env.ARCH }}
          retention-days: 7
          if-no-files-found: ignore
          path: dist/smoke-*/
      - name: Keep the dmg and zip
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: best-mac-${{ env.ARCH }}
          retention-days: 7
          if-no-files-found: ignore
          compression-level: 0
          path: |
            dist/*.dmg
            dist/*.zip

  intel:
    if: github.event_name == 'workflow_dispatch' && inputs.intel
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      ARCH: x64
    steps: *steps
